name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Install package
        run: python -m pip install -e .

      - name: Verify version consistency
        run: python scripts/check_version_consistency.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run sample benchmark
        run: python benchmarks/run_benchmark.py --mode placeholder --strategy strict --output benchmarks/sample_results.placeholder.json

      - name: Run mini realistic benchmark
        run: python benchmarks/run_benchmark.py --dataset benchmarks/mini_realistic_dataset.json --mode alias --strategy strict --output benchmarks/mini_realistic_results.alias.json

      - name: Validate OpenClaw plugin entry
        run: node --check openclaw-plugin/src/index.js

      - name: Verify Python build
        run: python -m build

      - name: Verify npm package contents
        run: npm pack --dry-run
        working-directory: openclaw-plugin
