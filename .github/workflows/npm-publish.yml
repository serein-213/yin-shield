name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # 必须开启 OIDC 权限，用于 Trusted Publishing 和 Provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
        working-directory: ./openclaw-plugin

      - name: Publish to NPM
        run: npm publish --access public --provenance
        working-directory: ./openclaw-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # 注意：NPM 目前仍可能需要 Token 辅助或配置说明
