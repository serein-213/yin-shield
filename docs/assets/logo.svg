<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256">
      <stop stop-color="#040906"/>
      <stop offset="1" stop-color="#0E1E16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="fade" x1="120" y1="40" x2="160" y2="170">
      <stop stop-color="#00FF66"/>
      <stop offset="0.6" stop-color="#00FF66"/>
      <stop offset="1" stop-color="#00FF66" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="64" fill="url(#bg)"/>
  <rect width="254" height="254" x="1" y="1" rx="63" stroke="#00FF66" stroke-opacity="0.1" stroke-width="2"/>

  <g transform="translate(-7, 18)">
    <!-- Base Cyber Sock -->
    <path d="M 80 40 L 80 140 A 40 40 0 0 0 120 180 L 170 180 A 20 20 0 0 0 190 160 A 20 20 0 0 0 170 140 L 140 140 A 20 20 0 0 1 120 120 L 120 40 Z" 
          fill="url(#fade)" filter="url(#glow)"/>

    <!-- Mosaic Pixels (De-identification) -->
    <g fill="#00FF66" opacity="0.8" filter="url(#glow)">
      <rect x="135" y="145" width="8" height="8" rx="1"/>
      <rect x="150" y="150" width="8" height="8" rx="1"/>
      <rect x="165" y="142" width="6" height="6" rx="1"/>
      <rect x="175" y="155" width="8" height="8" rx="1" opacity="0.7"/>
      <rect x="185" y="148" width="5" height="5" rx="1" opacity="0.5"/>
      <rect x="155" y="165" width="6" height="6" rx="1" opacity="0.5"/>
      <rect x="140" y="160" width="10" height="10" rx="1" opacity="0.4"/>
      
      <!-- Pixels flying off the toe! -->
      <rect x="195" y="145" width="6" height="6" rx="1" opacity="0.8"/>
      <rect x="205" y="138" width="4" height="4" rx="1" opacity="0.6"/>
      <rect x="198" y="165" width="5" height="5" rx="1" opacity="0.4"/>
      <rect x="212" y="152" width="4" height="4" rx="1" opacity="0.3"/>
    </g>

    <!-- Circuit/Grid Lines -->
    <g stroke="#040906" stroke-width="2" opacity="0.5">
      <line x1="80" y1="100" x2="116" y2="100"/>
      <line x1="80" y1="80" x2="118" y2="80"/>
      <line x1="80" y1="60" x2="120" y2="60"/>
    </g>
    
    <!-- Asterisk Top -->
    <g transform="translate(100, 60)" stroke="#040906" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-6" x2="0" y2="6"/>
      <line x1="-5" y1="-3" x2="5" y2="3"/>
      <line x1="-5" y1="3" x2="5" y2="-3"/>
    </g>
  </g>
</svg>
